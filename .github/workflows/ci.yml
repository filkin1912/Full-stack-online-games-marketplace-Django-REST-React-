name: CI

on:
  push:
    branches:
      - main
      - ci-test
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: examdb
          POSTGRES_USER: examuser
          POSTGRES_PASSWORD: exampass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      SECRET_KEY: ci-test-secret-key
      DEBUG: "False"
      DB_NAME: examdb
      DB_USER: examuser
      DB_PASSWORD: exampass
      DB_HOST: localhost
      DB_PORT: "5432"
      RAG_ENABLED: "False"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libjpeg-dev zlib1g-dev

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Django tests
        run: python manage.py test --verbosity=2

  frontend-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend_app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend_app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        env:
          CI: true
        run: npm test -- --watchAll=false

  deploy:
    name: Deploy to Azure
    needs:
      - backend-tests
      - frontend-tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    env:
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ secrets.AZURE_ACR_NAME }}

      - name: Build and push backend image
        run: |
          ACR="${{ secrets.AZURE_ACR_NAME }}.azurecr.io"
          docker build \
            -t "${ACR}/gamesplay-backend:${IMAGE_TAG}" \
            -t "${ACR}/gamesplay-backend:latest" \
            ./backend
          docker push "${ACR}/gamesplay-backend:${IMAGE_TAG}"
          docker push "${ACR}/gamesplay-backend:latest"

      - name: Deploy backend to Container Apps
        env:
          RG: ${{ secrets.AZURE_RESOURCE_GROUP }}
          APP: ${{ secrets.AZURE_CONTAINER_APP_BACKEND }}
          ACR: ${{ secrets.AZURE_ACR_NAME }}.azurecr.io
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_SSLMODE: ${{ secrets.DB_SSLMODE }}
          DB_CHANNEL_BINDING: ${{ secrets.DB_CHANNEL_BINDING }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          CSRF_TRUSTED_ORIGINS: ${{ secrets.CSRF_TRUSTED_ORIGINS }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: |
          az containerapp update \
            --name "$APP" \
            --resource-group "$RG" \
            --image "${ACR}/gamesplay-backend:${IMAGE_TAG}" \
            --set-env-vars \
              "SECRET_KEY=${SECRET_KEY}" \
              "DEBUG=False" \
              "ALLOWED_HOSTS=${ALLOWED_HOSTS}" \
              "DB_NAME=${DB_NAME}" \
              "DB_USER=${DB_USER}" \
              "DB_PASSWORD=${DB_PASSWORD}" \
              "DB_HOST=${DB_HOST}" \
              "DB_PORT=${DB_PORT}" \
              "DB_SSLMODE=${DB_SSLMODE}" \
              "DB_CHANNEL_BINDING=${DB_CHANNEL_BINDING}" \
              "CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}" \
              "CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}" \
              "CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}" \
              "CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}" \
              "CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}" \
              "AI_API_KEY=${AI_API_KEY}" \
              "PORT=8000"

      - name: Resolve backend URL
        id: backend
        env:
          RG: ${{ secrets.AZURE_RESOURCE_GROUP }}
          APP: ${{ secrets.AZURE_CONTAINER_APP_BACKEND }}
        run: |
          FQDN=$(az containerapp show \
            --name "$APP" \
            --resource-group "$RG" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "api_url=https://${FQDN}" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend image
        run: |
          ACR="${{ secrets.AZURE_ACR_NAME }}.azurecr.io"
          docker build \
            --build-arg REACT_APP_API_URL="${{ steps.backend.outputs.api_url }}" \
            -t "${ACR}/gamesplay-frontend:${IMAGE_TAG}" \
            -t "${ACR}/gamesplay-frontend:latest" \
            ./frontend_app
          docker push "${ACR}/gamesplay-frontend:${IMAGE_TAG}"
          docker push "${ACR}/gamesplay-frontend:latest"

      - name: Deploy frontend to Container Apps
        env:
          RG: ${{ secrets.AZURE_RESOURCE_GROUP }}
          APP: ${{ secrets.AZURE_CONTAINER_APP_FRONTEND }}
          ACR: ${{ secrets.AZURE_ACR_NAME }}.azurecr.io
        run: |
          az containerapp update \
            --name "$APP" \
            --resource-group "$RG" \
            --image "${ACR}/gamesplay-frontend:${IMAGE_TAG}"

      - name: Deployment summary
        run: |
          echo "Backend:  ${{ steps.backend.outputs.api_url }}"
          echo "Frontend: https://$(az containerapp show \
            --name '${{ secrets.AZURE_CONTAINER_APP_FRONTEND }}' \
            --resource-group '${{ secrets.AZURE_RESOURCE_GROUP }}' \
            --query 'properties.configuration.ingress.fqdn' -o tsv)"
